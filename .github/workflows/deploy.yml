name: Deploy to DirectAdmin Server

on:
  push:
    branches:
      - main

jobs:
  ci-test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    # ระบบใช้ MariaDB 11.4 ตัวเดียว → CI ต้องมีฐานจริงชนิดเดียวกัน ไม่งั้นเทสต์ไม่ครอบคลุม
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: admin_ph2
          MARIADB_USER: admin_ph2
          MARIADB_PASSWORD: admin_ph2pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://admin_ph2:admin_ph2pass@127.0.0.1:3306/admin_ph2
      SMOKE_DATABASE_URL: mysql://admin_ph2:admin_ph2pass@127.0.0.1:3306/admin_ph2_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: สร้างฐานทดสอบ
        run: |
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -uroot -prootpass -e "
              CREATE DATABASE IF NOT EXISTS admin_ph2_test
                CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
              GRANT ALL PRIVILEGES ON admin_ph2_test.* TO 'admin_ph2'@'%';
              FLUSH PRIVILEGES;"
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -uroot -prootpass -e "SHOW DATABASES;"

      - name: ติดตั้ง Backend
        run: npm ci
        working-directory: backend

      - name: ตรวจระบบ + ทดสอบ endpoint
        run: npm run verify
        working-directory: backend

      - name: ติดตั้ง Frontend
        run: npm ci
        working-directory: frontend

      - name: ตรวจสอบ Registry
        run: npm run verify:registry
        working-directory: frontend

      - name: ตรวจการออกจากระบบอัตโนมัติเมื่อไม่ใช้งาน 1 ชม.
        run: npm run verify:idle
        working-directory: frontend

      - name: ตรวจปุ่มลบซ้ำในหน้าเว็บ
        run: npm run verify:dupbtn
        working-directory: frontend

      - name: ตรวจคอลัมน์ตารางรายการจอง
        run: npm run verify:bookingcols
        working-directory: frontend

      - name: ตรวจการอัปเดตสถานะเฉพาะแถว
        run: npm run verify:rowupdate
        working-directory: frontend

      - name: ตรวจแท็บคงอยู่หลังกดรีเฟรช
        run: npm run verify:tabpersist
        working-directory: frontend

      - name: ตรวจลำดับซ้อนของ modal
        run: npm run verify:modalorder
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      - name: ตรวจสอบผลลัพธ์ Build
        run: npm run verify:build
        working-directory: frontend

  cd-deploy:
    name: Deploy to Server
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: SSH Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.SERVER_USER }}/domains/p2-smart.phrae2.go.th/app"
            WEB_DIR="/home/${{ secrets.SERVER_USER }}/domains/p2-smart.phrae2.go.th/public_html"

            # ⚠️ ชั่วคราว: เก็บ log ทั้งหมดของสคริปต์นี้ลงไฟล์ที่อ่านได้จากเว็บ
            #    (ใช้หาสาเหตุที่ deploy ล้มเหลว — จะถอดออกเมื่อแก้เสร็จ)
            DEPLOY_LOG="$WEB_DIR/p2deploy-log.txt"
            : > "$DEPLOY_LOG" 2>/dev/null || true
            exec >> "$DEPLOY_LOG" 2>&1 || true
            echo "===== deploy start $(date) ====="

            # ⚠️ ชั่วคราว: หาที่อยู่จริงของโปรเจกต์บนเซิร์ฟเวอร์
            #    (deploy ล้มเหลวเพราะ $APP_DIR ไม่มีอยู่แล้ว — โฟลเดอร์ถูกย้าย)
            DISCOVER="$WEB_DIR/p2discover.txt"
            {
              echo "== HOME =="; echo "$HOME"
              echo "== ls HOME =="; ls -la "$HOME" 2>&1
              echo "== ls domains =="; ls -la "$HOME/domains" 2>&1
              echo "== ls domain dir =="; ls -la "$HOME/domains/p2-smart.phrae2.go.th" 2>&1
              echo "== find backend/server.js =="
              find "$HOME" -maxdepth 6 -type f -name server.js -path '*/backend/server.js' -not -path '*/node_modules/*' 2>/dev/null | head -10
              echo "== pm2 describe =="; pm2 describe ph2-api 2>&1 | head -40
              echo "== find server.js (ลึก 8) =="
              find "$HOME" -maxdepth 8 -type f -name server.js -not -path '*/node_modules/*' 2>/dev/null | head -20
              echo "== find .git =="
              find "$HOME" -maxdepth 6 -type d -name .git 2>/dev/null | head -20
              echo "== domains อื่น ๆ =="
              for d in ph2system.phrae2.go.th test.phrae2.go.th phrae2.go.th; do
                echo "-- $d --"
                ls -la "$HOME/domains/$d" 2>&1
                ls -la "$HOME/domains/$d/public_html" 2>&1 | head -12
              done
              echo "== public_html ของ p2-smart =="
              ls -la "$HOME/domains/p2-smart.phrae2.go.th/public_html" 2>&1 | head -30
              echo "== trash =="
              ls -la "$HOME/.trash" 2>&1 | head -20
              ls -la "$HOME/.local/share/Trash/files" 2>&1 | head -20
              echo "== pm2 error log (tail 60) =="
              tail -n 60 "$HOME/.pm2/logs/ph2-api-error.log" 2>&1
              echo "== pm2 out log (tail 20) =="
              tail -n 20 "$HOME/.pm2/logs/ph2-api-out.log" 2>&1
              echo "== ค้นหา backup ของ DirectAdmin =="
              ls -la "$HOME/admin_backups" 2>&1 | head -15
              ls -la "$HOME/backups" 2>&1 | head -15
              find /home -maxdepth 3 -type d -iname '*backup*' 2>/dev/null | head -20
              find "$HOME" -maxdepth 4 -type f -iname '*.tar.gz' -o -maxdepth 4 -type f -iname '*.tar.zst' 2>/dev/null | head -20
              echo "== env keys ของ process ที่รันอยู่ =="
              PID=$(pm2 pid ph2-api 2>/dev/null | tail -1)
              echo "pid=$PID"
              tr '\0' '\n' < "/proc/$PID/environ" 2>/dev/null | sed -E 's/=.*/=<hidden>/' | head -40
              echo "== pm2 dump: ชื่อตัวแปร env =="
              grep -o '"[A-Z_]*":' "$HOME/.pm2/dump.pm2" 2>/dev/null | sort -u | head -30
            } > "$DISCOVER" 2>&1 || true
            chmod 644 "$DISCOVER" 2>/dev/null || true
            echo "    เขียนข้อมูลค้นหาที่ $DISCOVER"

            echo ">>> 1. ดึงโค้ดล่าสุด"
            cd $APP_DIR
            git reset --hard HEAD
            git pull origin main

            echo ">>> 2. ติดตั้ง Backend"
            cd backend
            npm ci --omit=dev

            echo ">>> 3. สร้าง/ปรับ schema + seed ข้อมูลตั้งต้น"
            # server.js ก็เรียก bootstrap() ตอนบูต แต่เรียกตรง ๆ ตรงนี้
            # เพื่อให้เห็น error ก่อน reload และไม่เสี่ยงทำให้ process ตายวน
            node db.js --init

            echo ">>> 4. นำเข้าข้อมูลโรงเรียนจริงจาก Definition.csv"
            # ใส่ --if-seed ไว้เพื่อกันไว้
            #   ขั้นตอนนี้ "ล้างตาราง schools ทั้งตาราง" แล้วนำเข้าใหม่
            #   ถ้ามีข้อมูลจริงอยู่แล้ว (คนละ seed) จะข้ามให้ ไม่ทับข้อมูลที่แอดมินแก้ไว้
            #   เช่น รูปภาพโรงเรียน ข้อมูลภัยพิบัติ หมายเหตุ และกลุ่มงาน
            node scripts/import_schools.js --if-seed

            echo ">>> 5. ตั้งรหัสโรงเรียนตามทะเบียนจริง (8 หลัก 5402xxxx)"
            # รหัสไม่ได้เรียงเอง แต่อ่านจาก pikud/school_codes.csv ทะเบียนที่ได้รับมา
            # ตัวเลขจึงเว้นตรงที่ทะเบียนไม่มี (ไม่มี 54020004 / 54020009 / 54020016)
            # ถ้าทะเบียนเปลี่ยน ให้แก้ CSV แล้วรันสคริปต์นี้ซ้ำ ห้ามแก้ฐานตรง ๆ
            #
            # ปลอดภัยเมื่อรันซ้ำ
            #   - ถ้ารหัสตรงทะเบียนแล้ว จะข้ามไปเงียบ ๆ
            #   - จับคู่โรงเรียนด้วยชื่อ (ไม่ใช่รหัสเดิม) จับไม่ครบจะหยุดทันที ไม่เดา
            #   - เป็น UPDATE เฉพาะคอลัมน์ code ไม่ลบตาราง
            node scripts/migrate_school_codes.js --apply

            echo ">>> 6. โหลดโค้ดใหม่เข้า process"
            pm2 reload ph2-api --update-env

            echo ">>> 7. Build Frontend"
            cd ../frontend
            npm ci
            npm run build

            echo ">>> 8. ซิงค์ไฟล์ Build ไปที่ Web Root (public_html)"
            # คัดลอกเฉพาะไฟล์ที่ build ได้ไปวางที่ public_html โดยไม่ลบ .htaccess
            # cp ทับเฉยๆ จะทำให้ไฟล์รุ่นเก่าไม่ถูกลบออกไปเลย (cp ไม่มีคำสั่งลบ)
            # เว็บยังใช้ได้ตลอด แต่ public_html จะโตขึ้นทุกครั้งที่ deploy
            cp -r dist/* $WEB_DIR/

            # ค่อยล้างไฟล์ใน assets ที่ไม่อยู่ใน build ปัจจุบัน
            #   ชื่อไฟล์มี hash จึงเปลี่ยนทุกครั้งที่ build ไฟล์เก่าไม่มีใครอ้างถึง
            #   ข้ามไฟล์ที่ยังไม่เก่า (<7 วัน) ไว้ เผื่อผู้ใช้เปิดหน้าเว็บค้างไว้
            #   แล้วเด้งไปเมนูอื่นที่โหลด chunk เก่า จะได้ไม่เจอรูปเสีย
            DIST_ASSETS="$APP_DIR/frontend/dist/assets"
            if [ -d "$WEB_DIR/assets" ]; then
              STALE=0
              for f in "$WEB_DIR/assets"/*; do
                [ -e "$f" ] || continue
                name=$(basename "$f")
                [ -e "$DIST_ASSETS/$name" ] && continue
                if [ -n "$(find "$f" -maxdepth 0 -mtime +7 2>/dev/null)" ]; then
                  rm -f "$f"
                  STALE=$((STALE + 1))
                fi
              done
              echo "    ล้างไฟล์เก่า $STALE ไฟล์"
            fi

            echo ">>> 8.1 ตั้งค่า Cache-Control ที่ web root (.htaccess)"
            # ⚠️ production เสิร์ฟไฟล์ด้วย Apache (public_html) ไม่ใช่ Express
            #    ค่าที่ server.js ตั้งไว้จึงไม่มีผลกับไฟล์ที่ Apache ส่งเอง
            #
            #    ปัญหาที่เคยเจอ: index.html ไม่มี Cache-Control → เบราว์เซอร์เดาเอง
            #    (heuristic caching) แล้วใช้ index เก่าหลัง deploy ผู้ใช้เห็นหน้าเดิม
            #    จนกว่าจะกด Ctrl+F5
            #
            #    วิธีแก้: จัดการบล็อกของเราเองใน .htaccess แบบ "ลบของเก่าแล้วใส่ใหม่"
            #      - ไม่แตะ directive อื่นของ DirectAdmin (ลบเฉพาะระหว่าง marker)
            #      - ทำซ้ำได้ (idempotent) ไม่ต่อซ้ำทุกครั้งที่ deploy
            #      - ถ้าจะเลิกใช้ ให้ลบบล็อกในไฟล์นี้ แล้ว deploy อีกครั้ง = ถูกถอดออก
            #
            #    ห่อด้วย IfModule mod_headers.c — ถ้าเซิร์ฟเวอร์ไม่ได้เปิดโมดูลนี้
            #    Apache จะข้ามไป ไม่ทำให้ทั้งเว็บเป็น 500
            HTC="$WEB_DIR/.htaccess"
            HTC_TMP="$WEB_DIR/.htaccess.p2tmp"
            HTC_BAK="$WEB_DIR/.htaccess.p2bak"
            # เก็บของเดิมไว้ เผื่อ directive ที่เพิ่มไปทำให้ Apache ตอบ 500
            if [ -f "$HTC" ]; then
              cp -p "$HTC" "$HTC_BAK" || cp "$HTC" "$HTC_BAK" || true
            fi
            if [ -f "$HTC" ] \
               && grep -q '^# >>> P2-SMART cache headers >>>$' "$HTC" \
               && grep -q '^# <<< P2-SMART cache headers <<<$' "$HTC"; then
              # มีบล็อกเดิมครบทั้งหัวและท้าย → ตัดออกก่อน แล้วค่อยใส่ใหม่
              awk '/^# >>> P2-SMART cache headers >>>$/{skip=1}
                   !skip{print}
                   /^# <<< P2-SMART cache headers <<<$/{skip=0}' "$HTC" > "$HTC_TMP"
            elif [ -f "$HTC" ]; then
              # ไม่มีบล็อกของเรา (หรือ marker ไม่ครบ) → คัดลอกไว้ทั้งไฟล์ ห้ามตัดทิ้ง
              cat "$HTC" > "$HTC_TMP"
            else
              : > "$HTC_TMP"
            fi
            cat >> "$HTC_TMP" <<'HTACCESS'

            # >>> P2-SMART cache headers >>>
            # index.html ต้องตรวจสอบกับเซิร์ฟเวอร์ทุกครั้ง (ชื่อไฟล์คงที่ แต่เนื้อหาเปลี่ยนทุก deploy)
            # ไฟล์ใน /assets/ มี hash ในชื่อแล้ว จึงแคชได้ยาวและไม่ต้องตรวจซ้ำ
            <IfModule mod_headers.c>
              <FilesMatch "^index\.html$">
                Header set Cache-Control "no-cache, no-store, must-revalidate"
              </FilesMatch>
              <FilesMatch "-[A-Za-z0-9_-]{8}\.(js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$">
                Header set Cache-Control "public, max-age=31536000, immutable"
              </FilesMatch>
            </IfModule>
            # <<< P2-SMART cache headers <<<
            HTACCESS
            # เขียนทับเนื้อหาเดิมในไฟล์เดิม (คงเจ้าของ/สิทธิ์ของ .htaccess ไว้)
            cat "$HTC_TMP" > "$HTC"
            rm -f "$HTC_TMP"
            echo "    อัปเดต Cache-Control ใน .htaccess แล้ว"

            echo ">>> 8.2 ตรวจว่าเว็บยังเปิดได้หลังแก้ .htaccess"
            # ⚠️ ถ้า Apache ตั้ง AllowOverride ไม่ให้ใช้ Header ใน .htaccess
            #    ทั้งเว็บจะกลายเป็น 500 — ต้องคืนไฟล์เดิมทันที ไม่ปล่อยให้เว็บล่ม
            SITE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "Host: p2-smart.phrae2.go.th" http://127.0.0.1/ || echo 000)
            if [ "$SITE_CODE" = "500" ]; then
              echo "!! Apache ตอบ 500 หลังแก้ .htaccess → คืนไฟล์เดิม"
              if [ -f "$HTC_BAK" ]; then
                cp -p "$HTC_BAK" "$HTC" || cp "$HTC_BAK" "$HTC"
              else
                rm -f "$HTC"
              fi
              echo "   คืน .htaccess เดิมแล้ว (เว็บใช้งานได้ตามเดิม แต่ยังไม่มี Cache-Control)"
              exit 1
            fi
            echo "    Apache ตอบ HTTP $SITE_CODE"
            rm -f "$HTC_BAK"

            echo ">>> 9. ตรวจว่าเซิร์ฟเวอร์ตอบกลับ"
            # ⚠️ เดิมเช็คแค่ /api/office ซึ่งเป็น endpoint สาธารณะ ไม่แตะตาราง sessions
            #    ถ้า deploy ทำให้ "ล็อกอิน" พัง แต่ /api/office ยังตอบได้
            #    → ขั้นนี้ผ่าน → รายงานว่าสำเร็จ ทั้งที่ผู้ใช้ล็อกอินไม่ได้
            #
            #    ① /api/office          = 200 → route + ฐานข้อมูล + schema พร้อม
            #    ② POST /api/auth/login = 401 → เส้นทางล็อกอินยังไม่พัง
            #       (ยิงด้วยชื่อผู้ใช้ปลอมโดยตั้งใจ → ได้ 401 ตามปกติ
            #        คือ route ทำงาน ไม่ใช่ 500 และไม่ได้สร้าง session เก็บไว้)
            for i in $(seq 1 10); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:3000/api/office || echo 000)
              if [ "$CODE" = "200" ]; then
                echo "    ตอบกลับแล้ว (รอบที่ $i)"
                break
              fi
              echo "    รอให้บูต... ($i/10 · HTTP $CODE)"
              sleep 3
              if [ "$i" = "10" ]; then
                echo "!! เซิร์ฟเวอร์ไม่ตอบกลับหลัง 30 วินาที"
                pm2 logs ph2-api --lines 40 --nostream
                exit 1
              fi
            done

            echo ">>> 9.1 ตรวจเส้นทางล็อกอินด้วย"
            LOGIN_CODE=$(curl -s -o /tmp/login-check.out -w "%{http_code}" --max-time 15 -X POST http://127.0.0.1:3000/api/auth/login -H "Content-Type: application/json" -d '{"username":"__healthcheck__","password":"__healthcheck__"}' || echo 000)
            if [ "$LOGIN_CODE" = "401" ]; then
              echo "    เส้นทางล็อกอินปกติ (401 ตามที่ควรเป็น)"
            else
              echo "!! เส้นทางล็อกอินตอบ HTTP $LOGIN_CODE (ควรเป็น 401)"
              echo "   เนื้อหาที่ได้:"
              head -c 500 /tmp/login-check.out || true
              echo ""
              pm2 logs ph2-api --lines 40 --nostream
              exit 1
            fi

            echo ">>> 9.2 เก็บข้อมูลวินิจฉัยชั่วคราว (uploads)"
            DIAG="$WEB_DIR/p2diag.txt"
            {
              echo "== date =="; date
              echo "== paths =="
              ls -ld "$APP_DIR" "$APP_DIR/backend" "$APP_DIR/backend/public" "$APP_DIR/backend/public/uploads" 2>&1
              echo "== readlink =="
              readlink -f "$APP_DIR/backend/public/uploads" 2>&1
              echo "== namei =="
              namei -l "$APP_DIR/backend/public/uploads" 2>&1
              echo "== ls uploads =="
              ls -la "$APP_DIR/backend/public/uploads" 2>&1 | head -30
              echo "== ls staff =="
              ls -la "$APP_DIR/backend/public/uploads/staff" 2>&1 | head -15
              echo "== dist =="
              ls -l "$APP_DIR/frontend/dist/index.html" 2>&1
              echo "== pm2 describe =="
              pm2 describe ph2-api 2>&1 | head -30
              echo "== curl node direct =="
              for u in /api/office /uploads /uploads/ /uploads/staff /uploads/staff/x.jpg /some-spa-route; do
                echo -n "$u => "
                curl -s -o /dev/null -w '%{http_code} %{content_type}\n' --max-time 10 "http://127.0.0.1:3000$u" 2>&1 || echo "(curl failed)"
              done
              echo "== pm2 error log (tail 100) =="
              tail -n 100 "$HOME/.pm2/logs/ph2-api-error.log" 2>&1
              echo "== pm2 out log (tail 30) =="
              tail -n 30 "$HOME/.pm2/logs/ph2-api-out.log" 2>&1
            } > "$DIAG" 2>&1 || true
            chmod 644 "$DIAG" 2>/dev/null || true
            echo "    เขียนข้อมูลวินิจฉัยที่ $DIAG"

            echo ">>> Deploy สำเร็จ!"