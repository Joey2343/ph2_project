name: Deploy to DirectAdmin Server

on:
  push:
    branches:
      - main

jobs:
  ci-test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest

    # ระบบใช้ MariaDB 11.4 ตัวเดียว → CI ต้องมีฐานจริงชนิดเดียวกัน ไม่งั้นเทสต์ไม่ครอบคลุม
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: admin_ph2
          MARIADB_USER: admin_ph2
          MARIADB_PASSWORD: admin_ph2pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://admin_ph2:admin_ph2pass@127.0.0.1:3306/admin_ph2
      SMOKE_DATABASE_URL: mysql://admin_ph2:admin_ph2pass@127.0.0.1:3306/admin_ph2_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: สร้างฐานทดสอบ
        run: |
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -uroot -prootpass -e "
              CREATE DATABASE IF NOT EXISTS admin_ph2_test
                CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;
              GRANT ALL PRIVILEGES ON admin_ph2_test.* TO 'admin_ph2'@'%';
              FLUSH PRIVILEGES;"
          docker exec "${{ job.services.mariadb.id }}" \
            mariadb -uroot -prootpass -e "SHOW DATABASES;"

      - name: ติดตั้ง Backend
        run: npm ci
        working-directory: backend

      - name: ตรวจระบบ + ทดสอบ endpoint
        run: npm run verify
        working-directory: backend

      - name: ติดตั้ง Frontend
        run: npm ci
        working-directory: frontend

      - name: ตรวจสอบ Registry
        run: npm run verify:registry
        working-directory: frontend

      - name: ตรวจการออกจากระบบอัตโนมัติเมื่อไม่ใช้งาน 1 ชม.
        run: npm run verify:idle
        working-directory: frontend

      - name: ตรวจปุ่มลบซ้ำในหน้าเว็บ
        run: npm run verify:dupbtn
        working-directory: frontend

      - name: ตรวจคอลัมน์ตารางรายการจอง
        run: npm run verify:bookingcols
        working-directory: frontend

      - name: ตรวจการอัปเดตสถานะเฉพาะแถว
        run: npm run verify:rowupdate
        working-directory: frontend

      - name: ตรวจแท็บคงอยู่หลังกดรีเฟรช
        run: npm run verify:tabpersist
        working-directory: frontend

      - name: ตรวจลำดับซ้อนของ modal
        run: npm run verify:modalorder
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      - name: ตรวจสอบผลลัพธ์ Build
        run: npm run verify:build
        working-directory: frontend

  cd-deploy:
    name: Deploy to Server
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      # ── เตรียมค่า DATABASE_URL ของ production (ถ้าผู้ดูแลตั้ง Secret ไว้) ──────
      # ส่งผ่าน base64 เพื่อไม่ให้รหัสผ่านถูกตีความโดย shell ของเซิร์ฟเวอร์
      # (อักขระอย่าง $ ` " ในรหัสผ่านจะทำให้คำสั่งเพี้ยนถ้าส่งตรง ๆ)
      - name: เตรียมค่า DATABASE_URL สำหรับกู้ backend/.env
        id: dbenv
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -n "$PROD_DATABASE_URL" ]; then
            echo "b64=$(printf '%s' "$PROD_DATABASE_URL" | base64 -w0)" >> "$GITHUB_OUTPUT"
            echo "พบ Secret PROD_DATABASE_URL — จะใช้สร้าง backend/.env บนเซิร์ฟเวอร์"
          else
            echo "b64=" >> "$GITHUB_OUTPUT"
            echo "ไม่พบ Secret PROD_DATABASE_URL"
          fi

      - name: SSH Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL_B64: ${{ steps.dbenv.outputs.b64 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: DB_URL_B64
          script: |
            set -e
            APP_DIR="/home/${{ secrets.SERVER_USER }}/domains/p2-smart.phrae2.go.th/app"
            WEB_DIR="/home/${{ secrets.SERVER_USER }}/domains/p2-smart.phrae2.go.th/public_html"

            # ── 0. กู้โฟลเดอร์โปรเจกต์ถ้าถูกทำหาย ────────────────────────────
            # ⚠️ ขั้นนี้ต้องอยู่ในไฟล์นี้ (ไม่ใช่ใน scripts/deploy-remote.sh)
            #    เพราะต้องมีโฟลเดอร์โปรเจกต์ก่อน จึงจะเรียกสคริปต์ที่อยู่ใน repo ได้
            # เมื่อ 21 ต.ค. โฟลเดอร์ app ทั้งโฟลเดอร์หายไปจากเซิร์ฟเวอร์
            # (โค้ด · backend/.env · backend/public/uploads) ทำให้ deploy ทุกครั้ง
            # ล้มเหลวที่ `cd $APP_DIR` และทำให้ /uploads ตอบ 500
            if [ ! -d "$APP_DIR/backend" ]; then
              echo ">>> 0. ไม่พบ $APP_DIR/backend — สร้างโปรเจกต์ใหม่จาก GitHub"
              if [ -d "$APP_DIR" ] && [ -n "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
                KEEP="$APP_DIR.broken-$(date +%Y%m%d%H%M%S)"
                mv "$APP_DIR" "$KEEP"
                echo "    ย้ายโฟลเดอร์เดิมไปเก็บไว้ที่ $KEEP"
              fi
              mkdir -p "$(dirname "$APP_DIR")"
              git clone --depth 1 https://github.com/Joey2343/ph2_project.git "$APP_DIR"
              mkdir -p "$APP_DIR/backend/public/uploads"
              echo "    สร้างใหม่เสร็จ · uploads ยังว่าง (ไฟล์เดิมหายไปพร้อมโฟลเดอร์)"
            fi

            echo ">>> 1. ดึงโค้ดล่าสุด"
            cd "$APP_DIR"
            git reset --hard HEAD
            git pull origin main

            # ขั้น 2–9 อยู่ใน scripts/deploy-remote.sh
            # (แยกออกมาเพราะ GitHub จำกัดความยาวของค่าหนึ่งค่าไว้ 21,000 ตัวอักษร
            #  และทำให้แก้ขั้นตอน deploy ได้โดยไม่ต้องแตะไฟล์ workflow)
            bash "$APP_DIR/scripts/deploy-remote.sh" "$APP_DIR" "$WEB_DIR"
