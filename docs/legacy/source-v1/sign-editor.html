<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🖊️ ลงนามในร่างเอกสาร</title>
<link rel="stylesheet" href="css/style.css">
<script src="vendor/pdfjs/pdf.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #e8edf3; }
  body { font-family: var(--font, 'Tahoma'); }
  #sign-toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid #dbe2ea;
    padding: 10px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(15,23,42,.08);
  }
  #sign-toolbar .tb-title { font-weight: 800; font-size: 15px; }
  #sign-toolbar .tb-sub { font-size: 12px; color: #64748b; }
  .tb-sig {
    display: flex; align-items: center; gap: 8px;
    border: 1px dashed #94a3b8; border-radius: 10px; padding: 4px 10px 4px 4px;
    background: #fffbeb; cursor: grab; user-select: none;
  }
  .tb-sig img { width: 120px; height: auto; pointer-events: none; }
  .tb-sig .grab { font-size: 12px; color: #b45309; font-weight: 600; }
  .tb-sig:active { cursor: grabbing; }
  #sign-status { font-weight: 700; font-size: 14px; }
  #sign-pages { padding: 22px 18px 40px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .sig-page-wrap { position: relative; box-shadow: 0 4px 16px rgba(15,23,42,.18); background: #fff; }
  .sig-page-wrap canvas { display: block; }
  .sig-page-label {
    position: absolute; top: -22px; left: 0; font-size: 12px; font-weight: 700; color: #475569;
  }
  .sig-stamp { position: absolute; cursor: move; user-select: none; touch-action: none; }
  .sig-stamp img { width: 100%; height: auto; pointer-events: none; }
  .sig-stamp .sig-del {
    position: absolute; top: -9px; right: -9px; width: 20px; height: 20px; border-radius: 50%;
    border: none; background: #dc2626; color: #fff; font-size: 11px; line-height: 1;
    cursor: pointer; display: none; align-items: center; justify-content: center; padding: 0;
  }
  .sig-stamp:hover .sig-del, .sig-stamp.dragging .sig-del { display: flex; }
  .sig-stamp .sig-rz {
    position: absolute; bottom: -10px; right: -10px; width: 20px; height: 20px;
    background: #2563eb; color: #fff; border: 2px solid #fff; border-radius: 6px;
    font-size: 12px; line-height: 1; cursor: nwse-resize;
    display: none; align-items: center; justify-content: center; padding: 0; touch-action: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .sig-stamp:hover .sig-rz, .sig-stamp.dragging .sig-rz { display: flex; }
  .sig-stamp .sig-rz:hover { background: #1d4ed8; }
  .sig-ghost {
    position: fixed; pointer-events: none; z-index: 999; opacity: .6;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.3));
  }
  .sig-ghost img { width: 100%; height: auto; }
  .sig-tip { font-size: 12px; color: #64748b; }
  .sig-btn { display: inline-flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
  <div id="sign-toolbar">
    <div>
      <div class="tb-title">🖊️ ลงนามในร่างเอกสาร</div>
      <div class="tb-sub" id="tb-memo">กำลังโหลด...</div>
    </div>
    <div class="tb-sig" id="sig-source" title="กดค้างแล้วลากไปวางบนเอกสาร หรือคลิกที่หน้าเอกสารเพื่อวางลายเซ็น">
      <img id="sig-thumb" alt="ลายเซ็นของฉัน">
      <span class="grab">⇱ ลากลงเอกสาร</span>
    </div>
    <div class="sig-tip">ลายเซ็น: <b id="sig-user">...</b> — วางได้ทุกหน้า กด ✕ เพื่อลบ ลากเพื่อย้ายตำแหน่ง ลากมุม <b style="color:#2563eb">⤡</b> เพื่อปรับขนาด</div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:10px">
      <span id="sign-status"></span>
      <button class="btn btn-outline btn-sm" id="btn-close">✕ ปิด</button>
      <button class="btn btn-success btn-sm sig-btn" id="btn-save">💾 บันทึกลงนาม</button>
    </div>
  </div>
  <div id="sign-pages"></div>
  <script src="js/sign-editor.js?v=1"></script>
</body>
</html>
